<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="13.333in" height="7.5in" preserveAspectRatio="xMidYMid meet" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>Kubernetes 전체 구성과 저장소 영역</title>
  <desc>Cluster, Control Plane, Worker Node, Pod와 저장소 디렉터리 영역의 큰 관계를 보여준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.cluster{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.plane{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.5}.node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.pod{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.resource{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}.h{font-size:18px;font-weight:700;fill:#1d4ed8}.g{font-size:16px;font-weight:700;fill:#0f766e}.r{font-size:15px;font-weight:700;fill:#c2410c}.t{font-size:13px;fill:#1e293b}.edge{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fff"/>
  <text x="50" y="52" class="title">Kubernetes 전체 구성</text>
  <text x="50" y="80" class="sub">클러스터의 큰 구조와 학습·운영 저장소 영역을 한눈에 본다.</text>

  <rect x="40" y="110" width="1120" height="555" rx="18" class="cluster"/>
  <text x="70" y="148" class="h">Cluster</text>

  <rect x="75" y="180" width="390" height="215" rx="14" class="plane"/>
  <text x="100" y="220" class="h">Control Plane</text>
  <text x="100" y="255" class="t">API Server · Scheduler</text>
  <text x="100" y="282" class="t">Controller · etcd</text>
  <text x="100" y="330" class="t">리소스 요청을 받고</text>
  <text x="100" y="355" class="t">원하는 상태를 조정·저장</text>

  <rect x="505" y="180" width="615" height="385" rx="14" class="node"/>
  <text x="535" y="220" class="h">Worker Node</text>
  <text x="535" y="250" class="t">kubelet · container runtime</text>

  <rect x="535" y="285" width="250" height="215" rx="12" class="pod"/>
  <text x="565" y="325" class="g">Pod</text>
  <text x="565" y="360" class="t">Container</text>
  <text x="565" y="390" class="t">애플리케이션 실행 단위</text>
  <text x="565" y="430" class="t">ConfigMap · Secret</text>
  <text x="565" y="460" class="t">환경 설정·민감 정보 주입</text>

  <rect x="825" y="285" width="250" height="215" rx="12" class="resource"/>
  <text x="855" y="325" class="r">접근·데이터 리소스</text>
  <text x="855" y="360" class="t">Service</text>
  <text x="855" y="390" class="t">Pod 접근 경로 제공</text>
  <text x="855" y="430" class="t">PVC → PV</text>
  <text x="855" y="460" class="t">영속 데이터 연결</text>

  <rect x="75" y="455" width="390" height="110" rx="12" class="resource"/>
  <text x="100" y="492" class="r">상태 관리 리소스</text>
  <text x="100" y="522" class="t">Deployment · StatefulSet · Job</text>
  <text x="100" y="548" class="t">Pod의 원하는 상태 선언</text>

  <path d="M465 285H530" class="edge"/>
  <path d="M270 395V450" class="edge"/>
  <path d="M785 390H820" class="edge"/>
  <path d="M270 455V400" class="dash"/>
  <text x="485" y="270" class="t">Pod 배치·상태 조정</text>
  <text x="300" y="430" class="t">Controller</text>
  <text x="792" y="375" class="t">연결·저장</text>

  <text x="75" y="620" class="sub">설치: install/</text>
  <text x="300" y="620" class="sub">학습: practice-order/</text>
  <text x="590" y="620" class="sub">운영: operations/</text>
  <text x="850" y="620" class="sub">참조: examples/</text>
</svg>
