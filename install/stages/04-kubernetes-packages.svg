<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">4. Kubernetes 패키지 설치</title>
  <desc id="desc">버전을 고정한 kubeadm, kubelet, kubectl을 모든 노드에 설치한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">4. Kubernetes 패키지 설치</text>
  <text x="60" y="91" font-family="Arial,sans-serif" font-size="16" fill="#475569">버전을 고정한 kubeadm, kubelet, kubectl을 모든 노드에 설치한다.</text>

  <rect x="70" y="180" width="350" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="245" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">Ansible</text>
  <text x="245" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e3a8a">kubernetes-packages role</text>
  <line x1="120" y1="300" x2="370" y2="300" stroke="#bfdbfe" stroke-width="2"/>
  <text x="245" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#1e3a8a">apt 저장소 · kubeadm · kubelet · kubectl</text>
  <text x="245" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#1e3a8a">클러스터 도구 준비 완료</text>

  <path d="M420 305 H505" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="505" y="150" width="390" height="310" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#c2410c">모든 노드</text>
  <text x="700" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7c2d12">apt 저장소 · kubeadm · kubelet · kubectl</text>
  <line x1="565" y1="275" x2="835" y2="275" stroke="#fed7aa" stroke-width="2"/>
  <text x="700" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">세 패키지 버전과 kubelet 상태 확인</text>
  <text x="700" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">클러스터 도구 준비 완료</text>
  <text x="700" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9a3412">Ansible task 또는 playbook 실행</text>

  <path d="M895 305 H980" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="980" y="180" width="350" height="250" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="1155" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#166534">세 패키지 버전과 kubelet 상태 확인</text>
  <text x="1155" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#14532d">클러스터 도구 준비 완료</text>
  <line x1="1030" y1="300" x2="1280" y2="300" stroke="#bbf7d0" stroke-width="2"/>
  <text x="1155" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#14532d">undefined</text>
  <text x="1155" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#14532d">다음 단계 진행 조건 확인</text>

  <rect x="260" y="560" width="880" height="80" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#334155">단계 검증</text>
  <text x="700" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">클러스터 도구 준비 완료 · undefined</text>
</svg>
