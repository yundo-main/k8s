# Ansible이 접속할 Kubernetes 노드 목록과 공통 SSH 설정이다.
# 이 파일은 Mac 관리 호스트에서 실행하며, 각 노드에는 Ansible을 설치하지 않는다.
all:
  vars:
    # 원격 SSH 사용자명은 K8S_SSH_USER 환경변수로 바꿀 수 있다.
    # 예: export K8S_SSH_USER=test01
    ansible_user: "{{ lookup('env', 'K8S_SSH_USER') | default('groom', true) }}"
    # 관리 호스트의 개인키는 저장소에 넣지 않는다.
    # K8S_SSH_KEY가 없으면 현재 사용자의 기본 키 경로를 사용한다.
    # 예: export K8S_SSH_KEY="$HOME/.ssh/k8s_ed25519"
    ansible_ssh_private_key_file: "{{ lookup('env', 'K8S_SSH_KEY') | default(lookup('env', 'HOME') ~ '/.ssh/k8s_ed25519', true) }}"
    ansible_python_interpreter: /usr/bin/python3

  # Control Plane과 Worker를 역할별 그룹으로 나눈다.
  children:
    control_plane:
      hosts:
        cp-00:
          ansible_host: 10.10.10.150

    workers:
      hosts:
        worker-01:
          ansible_host: 10.10.10.151
        worker-02:
          ansible_host: 10.10.10.152
