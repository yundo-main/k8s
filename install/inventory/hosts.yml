# Ansible이 접속할 Kubernetes 노드 목록과 공통 SSH 설정이다.
# 이 파일은 Mac 관리 호스트에서 실행하며, 각 노드에는 Ansible을 설치하지 않는다.
all:
  vars:
    # 실제 원격 SSH 사용자명으로 변경한다.
    # ansible_user: test01
    ansible_user: groom
    # Mac의 SSH 개인키 경로를 지정한다.
    ansible_ssh_private_key_file: /Users/jarrod/.ssh/k8s_ed25519
    ansible_python_interpreter: /usr/bin/python3

  # Control Plane과 Worker를 역할별 그룹으로 나눈다.
  children:
    control_plane:
      hosts:
        cp-01:
          ansible_host: 10.10.10.150

    workers:
      hosts:
        worker-01:
          ansible_host: 10.10.10.151
        worker-02:
          ansible_host: 10.10.10.152
