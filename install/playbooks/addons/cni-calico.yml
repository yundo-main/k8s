# 실행 순서 07: Control Plane에 Calico CNI를 설치하고 노드 상태를 확인한다.
# Calico manifest의 Pod CIDR 설정은 control-plane.yml과 일치해야 한다.
# CNI가 준비되기 전에는 Worker와 CoreDNS가 Ready가 되지 않을 수 있다.
# 이 Playbook은 Control Plane의 admin.conf와 sudo 권한을 사용한다.
- name: Calico CNI 설치
  hosts: control_plane[0]
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    kubeconfig_path: /etc/kubernetes/admin.conf
    calico_version: "v3.33.0"
    calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

  # Control Plane에서만 manifest를 적용하고 rollout을 검증한다.
  tasks:
    - name: Calico manifest를 Kubernetes에 적용한다.
      ansible.builtin.command:
        cmd: "kubectl --kubeconfig={{ kubeconfig_path }} apply -f {{ calico_manifest_url }}"
      register: calico_apply
      changed_when: "'configured' in calico_apply.stdout or 'created' in calico_apply.stdout"

    - name: Calico DaemonSet이 모든 노드에서 준비될 때까지 기다린다.
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ kubeconfig_path }} rollout status daemonset/calico-node -n kube-system --timeout=300s
      register: calico_rollout
      changed_when: false

    - name: 노드 상태를 확인한다.
      ansible.builtin.command:
        cmd: kubectl --kubeconfig={{ kubeconfig_path }} get nodes -o wide
      register: node_status
      changed_when: false

    - name: Calico와 노드 상태를 출력한다.
      ansible.builtin.debug:
        msg:
          - "{{ calico_apply.stdout_lines }}"
          - "{{ calico_rollout.stdout }}"
          - "{{ node_status.stdout_lines }}"
