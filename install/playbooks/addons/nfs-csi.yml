---
- name: Install NFS CSI addon
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run NFS CSI installer
      ansible.builtin.command:
        argv:
          - bash
          - "{{ playbook_dir }}/../../addons/storage/install-csi-nfs.sh"
      environment:
        KUBECONFIG: "{{ lookup('ansible.builtin.env', 'KUBECONFIG') }}"
