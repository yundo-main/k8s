# 실행 순서 05: 모든 노드에 kubeadm·kubelet·kubectl을 설치하고 버전을 고정한다.
# Kubernetes minor 버전은 group_vars/all.yml의 kubernetes_minor_version으로 관리한다.
# 현재 버전은 이 파일의 변수로 지정하며, 실행 전 공식 저장소 지원 여부를 확인한다.
- name: Kubernetes 패키지 설치 및 고정
  hosts: all
  become: true
  become_method: sudo
  gather_facts: true

  vars:
    kubernetes_minor_version: "v1.34"
    kubernetes_keyring_dir: /etc/apt/keyrings
    kubernetes_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    kubernetes_release_key: /tmp/kubernetes-release.key

  # 공식 Kubernetes APT 저장소 등록, 패키지 설치와 hold를 수행한다.
  tasks:
    - name: APT 서명 키 디렉터리를 만든다.
      ansible.builtin.file:
        path: "{{ kubernetes_keyring_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Kubernetes 저장소 준비 패키지를 설치한다.
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
          - python3-debian
        state: present
        update_cache: true

    - name: Kubernetes 저장소 서명 키를 다운로드한다.
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: "{{ kubernetes_release_key }}"
        owner: root
        group: root
        mode: '0644'

    - name: 저장소 서명 키를 keyring 형식으로 변환한다.
      ansible.builtin.command:
        cmd: "gpg --dearmor --yes -o {{ kubernetes_keyring }} {{ kubernetes_release_key }}"
      changed_when: true

    - name: Kubernetes APT 저장소를 deb822 형식으로 등록한다.
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/"
        suites: /
        components: []
        signed_by: "{{ kubernetes_keyring }}"
        enabled: true
        state: present

    - name: Kubernetes 저장소의 패키지 목록을 갱신한다.
      ansible.builtin.apt:
        update_cache: true

    - name: Kubernetes 패키지를 설치한다.
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Kubernetes 패키지 버전을 고정한다.
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: kubelet을 활성화한다.
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: kubeadm 버전을 확인한다.
      ansible.builtin.command: kubeadm version
      register: kubeadm_version
      changed_when: false

    - name: kubectl 클라이언트 버전을 확인한다.
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: 설치 결과를 출력한다.
      ansible.builtin.debug:
        msg:
          - "kubeadm: {{ kubeadm_version.stdout }}"
          - "kubectl: {{ kubectl_version.stdout }}"
