# 실행 순서 08: Worker 노드를 Control Plane에 조인시키고 전체 노드 상태를 확인한다.
# join 토큰은 로그에 출력하지 않는다.
# Control Plane에서 토큰을 만들고 Worker에만 join 명령을 전달한다.
- name: Worker 조인 명령 생성
  hosts: control_plane[0]
  become: true
  become_method: sudo
  gather_facts: false

  # 일회성 join 토큰을 생성하며 no_log로 민감한 출력 노출을 막는다.
  tasks:
    - name: Worker용 kubeadm join 명령을 생성한다.
      ansible.builtin.command: kubeadm token create --print-join-command
      register: kubeadm_join_command_raw
      changed_when: false
      no_log: true

    - name: containerd CRI 소켓을 포함한 join 명령을 저장한다.
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join_command_raw.stdout }} --cri-socket unix:///run/containerd/containerd.sock"
      no_log: true

- name: Worker 노드 조인
  hosts: workers
  become: true
  become_method: sudo
  gather_facts: false

  # 이미 조인된 Worker는 kubelet.conf 존재 여부로 재실행을 건너뛴다.
  tasks:
    - name: Worker를 Kubernetes 클러스터에 조인한다.
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['control_plane'][0]].kubeadm_join_command }}"
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join
      changed_when: true
      no_log: true

    - name: kubelet 서비스를 활성화하고 시작한다.
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

- name: 전체 노드 상태 검증
  hosts: control_plane[0]
  become: true
  become_method: sudo
  gather_facts: false

  # 조인 후 Control Plane에서 전체 노드 목록을 확인한다.
  tasks:
    - name: 전체 Kubernetes 노드 상태를 확인한다.
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
      register: cluster_nodes
      changed_when: false

    - name: 조인 결과를 출력한다.
      ansible.builtin.debug:
        msg: "{{ cluster_nodes.stdout_lines }}"
