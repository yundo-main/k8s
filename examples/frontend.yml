
---
# 📦 ConfigMap: Frontend HTML 제공
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html

data:
  login.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <meta charset="UTF-8">
    <head>
    <title>로그인</title> </head>
    <body>
    <h2>로그인</h2>
    <form method="POST" action="/api/login">
    <label for="username">아이디:</label><br>
    <input type="text" id="username" name="username" required><br><br>
    <label for="password">비밀번호:</label><br>
    <input type="password" id="password" name="password" required><br><br>
    <button type="submit">로그인</button>
    </form>
    </body>
    </html>
  register.html: |
    <!DOCTYPE html>
    <html>
    <meta charset="UTF-8">
    <head><title>회원가입</title></head>
    <body>
      <h2>회원가입</h2>
      <form method="POST" action="/api/register">
        <label>아이디: <input type="text" name="username" /></label><br>
        <label>비밀번호: <input type="password" name="password" /></label><br>
        <button type="submit">가입</button>
      </form>
    </body>
    </html>

---
# 🖥️   Frontend Nginx (정적 HTML 제공)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: jarrodkim/nginx-test:latest
        # 원래 이미지 nginx:1.30.5-alpine3.24 지만 pod 실습을 위한 
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend
  type: ClusterIP
