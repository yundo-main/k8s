---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcgi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastcgi-backend
  template:
    metadata:
      labels:
        app: fastcgi-backend
    spec:
      containers:
      - name: backend
        image: jarrodkim/fastapi-test:latest
        env:
        - name: MODULE_NAME
          value: main
        - name: DB_HOST
          value: mariadb
        - name: DB_USER
          value: fcgiuser
        - name: DB_PASSWORD
          value: fcgipass
        - name: DB_NAME
          value: fcgidb
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: backend-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app

data:
  main.py: |
    from fastapi import FastAPI, Form , HTTPException
    import pymysql

    app = FastAPI()

    @app.post("/api/register")
    async def register(username: str = Form(...), password: str = Form(...)):
        conn = pymysql.connect(
            host="mariadb",
            user="fcgiuser",
            password="fcgipass",
            database="fcgidb"
        )
        with conn.cursor() as cursor:
            cursor.execute("INSERT INTO users (username, password) VALUES (%s, %s)", (username, password))
        conn.commit()
        return {"message": "가입 완료!"}

    @app.post("/api/login")
    async def login(username: str = Form(...), password: str = Form(...)):
        conn = pymysql.connect(
            host="mariadb",
            user="fcgiuser",
            password="fcgipass",
            database="fcgidb"
        )
        with conn.cursor() as cursor:
            cursor.execute("SELECT * FROM users WHERE username=%s AND password=%s", (username, password))
            result = cursor.fetchone()
        if result:
            return {"message": "로그인 성공"}
        else:
            raise HTTPException(status_code=401, detail="로그인 실패")
---
apiVersion: v1
kind: Service
metadata:
  name: fastcgi-backend
spec:
  selector:
    app: fastcgi-backend
  ports:
  - port: 8000
    targetPort: 8000
