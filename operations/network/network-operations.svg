<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>네트워크 운영 점검 흐름</title><desc>Service, Endpoint, Ingress와 NetworkPolicy 경로를 확인한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">네트워크 운영 점검</text><text x="50" y="84" class="sub">요청이 어느 계층에서 끊겼는지 Client·Ingress·Service·Endpoint 순서로 확인한다.</text>
  <rect x="55" y="155" width="210" height="185" rx="12" class="box"/><text x="80" y="195" class="h">Client</text><text x="80" y="235" class="t">curl / 브라우저</text><text x="80" y="261" class="t">NodePort·ClusterIP</text><text x="80" y="311" class="n">접속 주소·포트 확인</text>
  <rect x="295" y="155" width="210" height="185" rx="12" class="box"/><text x="320" y="195" class="h">Ingress</text><text x="320" y="235" class="t">IngressClass</text><text x="320" y="261" class="t">Controller·Rule</text><text x="320" y="311" class="n">외부 경로 라우팅</text>
  <rect x="535" y="155" width="210" height="185" rx="12" class="box"/><text x="560" y="195" class="h">Service</text><text x="560" y="235" class="t">ClusterIP·Port</text><text x="560" y="261" class="t">selector</text><text x="560" y="311" class="n">가상 IP와 선택 조건</text>
  <rect x="775" y="155" width="210" height="185" rx="12" class="box"/><text x="800" y="195" class="h">Endpoint</text><text x="800" y="235" class="t">EndpointSlice</text><text x="800" y="261" class="t">Ready Pod IP</text><text x="800" y="311" class="n">실제 대상 확인</text>
  <rect x="1015" y="155" width="145" height="185" rx="12" class="box"/><text x="1035" y="195" class="h">Policy</text><text x="1035" y="235" class="t">NetworkPolicy</text><text x="1035" y="261" class="t">DNS·Egress</text><text x="1035" y="311" class="n">허용 경로</text>
  <path d="M265 247H290" class="e"/><path d="M505 247H530" class="e"/><path d="M745 247H770" class="e"/><path d="M985 247H1010" class="e"/>
  <rect x="180" y="440" width="840" height="90" rx="12" class="box"/><text x="210" y="478" class="h">명령 예시</text><text x="380" y="478" class="t">kubectl get ingress,svc,endpoints,endpointslice -A</text><text x="380" y="505" class="n">경로별로 대상이 존재하는지 확인한 후 Pod 내부 DNS·포트·정책을 점검한다.</text>
</svg>
