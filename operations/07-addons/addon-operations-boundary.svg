<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>Addon과 Operations의 관계</title><desc>Addon이 기능을 제공하고 Operations가 상태를 관찰하고 복구하는 관계를 보여준다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.addon{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.8}.ops{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.8}.h{font-size:20px;font-weight:700;fill:#1d4ed8}.g{font-size:20px;font-weight:700;fill:#15803d}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">Addon과 Operations</text><text x="50" y="84" class="sub">설치 기능과 설치 후 상태 관리의 책임을 분리한다.</text>
  <rect x="70" y="145" width="330" height="260" rx="14" class="addon"/><text x="100" y="190" class="h">Addon</text><text x="100" y="230" class="t">클러스터 기능을 확장</text><text x="100" y="265" class="t">CNI·Ingress·CSI</text><text x="100" y="291" class="t">Metrics Server·Operator</text><text x="100" y="345" class="n">설치: install/playbooks/addons/</text><text x="100" y="370" class="n">기능 제공: Controller·Driver</text>
  <rect x="500" y="145" width="330" height="260" rx="14" class="ops"/><text x="530" y="190" class="g">Operations</text><text x="530" y="230" class="t">설치된 기능의 상태를 관리</text><text x="530" y="265" class="t">Pod·Service·API 상태</text><text x="530" y="291" class="t">로그·이벤트·용량·복구</text><text x="530" y="345" class="n">자료: operations/07-addons/</text><text x="530" y="370" class="n">검증: kubectl·메트릭·경로</text>
  <rect x="930" y="145" width="200" height="260" rx="14" class="box"/><text x="960" y="190" class="h">실습</text><text x="960" y="230" class="t">practice-order/</text><text x="960" y="265" class="t">Ingress·PVC</text><text x="960" y="291" class="t">HPA·NetworkPolicy</text><text x="960" y="345" class="n">Addon이 준비된 뒤</text><text x="960" y="370" class="n">선언 리소스를 적용</text>
  <path d="M405 275H495" class="e"/><path d="M835 275H925" class="e"/><path d="M925 320H840V450H360V410" class="e"/><text x="430" y="440" class="n">운영 검증 결과를 다음 변경·복구 판단에 반영</text>
  <rect x="190" y="505" width="820" height="58" rx="10" class="box"/><text x="220" y="540" class="t">설치와 운영은 분리하지만, 실제 서비스 검증에서는 하나의 흐름으로 연결한다.</text>
</svg>
