<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>클러스터 운영 점검 흐름</title><desc>API readiness, 노드와 시스템 Pod를 순서대로 점검한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">클러스터 운영 점검</text><text x="50" y="84" class="sub">API 응답부터 노드·시스템 구성요소·이벤트까지 범위를 넓혀 확인한다.</text>
  <rect x="60" y="150" width="245" height="180" rx="12" class="box"/><text x="85" y="190" class="h">1. API 상태</text><text x="85" y="230" class="t">kubectl cluster-info</text><text x="85" y="256" class="t">kubectl get --raw=/readyz</text><text x="85" y="300" class="n">API Server 응답과 준비 상태</text>
  <rect x="345" y="150" width="245" height="180" rx="12" class="box"/><text x="370" y="190" class="h">2. 노드</text><text x="370" y="230" class="t">kubectl get nodes -o wide</text><text x="370" y="256" class="t">Ready·IP·OS·Architecture</text><text x="370" y="300" class="n">NotReady와 자원 상태 식별</text>
  <rect x="630" y="150" width="245" height="180" rx="12" class="box"/><text x="655" y="190" class="h">3. 시스템 Pod</text><text x="655" y="230" class="t">kubectl get pods -A</text><text x="655" y="256" class="t">CNI·CoreDNS·kube-system</text><text x="655" y="300" class="n">CrashLoop·Pending 확인</text>
  <rect x="915" y="150" width="225" height="180" rx="12" class="box"/><text x="940" y="190" class="h">4. 이벤트</text><text x="940" y="230" class="t">kubectl get events -A</text><text x="940" y="256" class="t">시간순 Warning 분석</text><text x="940" y="300" class="n">원인 추적의 시작점</text>
  <path d="M305 240H340" class="e"/><path d="M590 240H625" class="e"/><path d="M875 240H910" class="e"/>
  <rect x="160" y="430" width="880" height="100" rx="12" class="box"/><text x="190" y="470" class="h">판정</text><text x="290" y="470" class="t">정상: 다음 운영 영역으로 이동</text><text x="290" y="500" class="t">이상: 해당 노드·Pod·Addon의 describe, logs, events로 상세 분석</text><path d="M1025 330V405H600V425" class="e"/>
</svg>
