<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>워크로드 운영 흐름</title><desc>워크로드의 배포 상태, Pod, 로그와 이벤트를 확인한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">워크로드 운영 점검</text><text x="50" y="84" class="sub">Controller의 desired state부터 실제 Pod 상태와 애플리케이션 로그까지 확인한다.</text>
  <rect x="60" y="155" width="250" height="185" rx="12" class="box"/><text x="85" y="195" class="h">1. Controller</text><text x="85" y="235" class="t">Deployment / StatefulSet</text><text x="85" y="261" class="t">DaemonSet / Job</text><text x="85" y="311" class="n">replicas·rollout·conditions</text>
  <rect x="345" y="155" width="250" height="185" rx="12" class="box"/><text x="370" y="195" class="h">2. Pod</text><text x="370" y="235" class="t">kubectl get pods</text><text x="370" y="261" class="t">Ready·Restart·Image</text><text x="370" y="311" class="n">Pending·CrashLoop 분류</text>
  <rect x="630" y="155" width="250" height="185" rx="12" class="box"/><text x="655" y="195" class="h">3. 원인 분석</text><text x="655" y="235" class="t">describe pod</text><text x="655" y="261" class="t">logs / logs --previous</text><text x="655" y="311" class="n">이벤트·Probe·환경변수</text>
  <rect x="915" y="155" width="225" height="185" rx="12" class="box"/><text x="940" y="195" class="h">4. 검증</text><text x="940" y="235" class="t">rollout status</text><text x="940" y="261" class="t">Service Endpoint</text><text x="940" y="311" class="n">실제 요청 확인</text>
  <path d="M310 247H340" class="e"/><path d="M595 247H625" class="e"/><path d="M880 247H910" class="e"/>
  <path d="M1025 350V440H175V350" class="e"/><text x="420" y="430" class="n">문제가 남으면 Controller → Pod → 컨테이너 로그 순서로 다시 좁힌다.</text>
</svg>
