<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>장애 분석 흐름</title><desc>이벤트와 상태에서 시작해 describe, logs, 네트워크와 리소스를 확인한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" height="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}.warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:1.6}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">Kubernetes 장애 분석</text><text x="50" y="84" class="sub">넓은 범위에서 좁은 범위로 원인을 줄이고, 조치 후 같은 경로로 복구를 검증한다.</text>
  <rect x="60" y="155" width="245" height="185" rx="12" class="box"/><text x="85" y="195" class="h">1. 증상 수집</text><text x="85" y="235" class="t">get pods / nodes</text><text x="85" y="261" class="t">events --sort-by</text><text x="85" y="311" class="n">영향 범위와 시작 시간</text>
  <rect x="345" y="155" width="245" height="185" rx="12" class="box"/><text x="370" y="195" class="h">2. 대상 상세화</text><text x="370" y="235" class="t">describe resource</text><text x="370" y="261" class="t">conditions·events</text><text x="370" y="311" class="n">스케줄·Probe·Mount</text>
  <rect x="630" y="155" width="245" height="185" rx="12" class="box"/><text x="655" y="195" class="h">3. 실행 로그</text><text x="655" y="235" class="t">logs</text><text x="655" y="261" class="t">logs --previous</text><text x="655" y="311" class="n">애플리케이션·kubelet</text>
  <rect x="915" y="155" width="225" height="185" rx="12" class="warn"/><text x="940" y="195" class="h">4. 조치·검증</text><text x="940" y="235" class="t">설정·롤백·복구</text><text x="940" y="261" class="t">서비스 요청 재시험</text><text x="940" y="311" class="n">변경 기록 남김</text>
  <path d="M305 247H340" class="e"/><path d="M590 247H625" class="e"/><path d="M875 247H910" class="e"/>
  <rect x="180" y="440" width="840" height="90" rx="12" class="box"/><text x="210" y="478" class="h">보안·운영 원칙</text><text x="410" y="478" class="t">Secret·토큰·kubeconfig를 로그와 명령 출력에 노출하지 않는다.</text><text x="410" y="505" class="n">파괴적 조치는 대상·백업·영향 범위를 확인한 뒤 승인된 범위에서 수행한다.</text>
</svg>
