<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>노드 운영 점검 흐름</title><desc>노드 목록, 상세 상태, 자원과 배치된 Pod를 확인하는 흐름이다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">노드 운영 점검</text><text x="50" y="84" class="sub">노드 전체 상태에서 특정 노드의 조건·자원·Pod·이벤트로 좁혀간다.</text>
  <rect x="65" y="160" width="250" height="175" rx="12" class="box"/><text x="90" y="200" class="h">1. 목록</text><text x="90" y="240" class="t">kubectl get nodes -o wide</text><text x="90" y="266" class="t">Ready·Role·IP·Runtime</text><text x="90" y="306" class="n">문제 노드 선택</text>
  <rect x="350" y="160" width="250" height="175" rx="12" class="box"/><text x="375" y="200" class="h">2. 상세</text><text x="375" y="240" class="t">kubectl describe node</text><text x="375" y="266" class="t">Conditions·Capacity</text><text x="375" y="306" class="n">Pressure·Taint·Events</text>
  <rect x="635" y="160" width="250" height="175" rx="12" class="box"/><text x="660" y="200" class="h">3. 배치·자원</text><text x="660" y="240" class="t">kubectl get pods -A -o wide</text><text x="660" y="266" class="t">--field-selector nodeName</text><text x="660" y="306" class="n">Pod 자원 요청과 집중도</text>
  <rect x="920" y="160" width="215" height="175" rx="12" class="box"/><text x="945" y="200" class="h">4. 조치</text><text x="945" y="240" class="t">cordon / drain</text><text x="945" y="266" class="t">노드 복구·교체</text><text x="945" y="306" class="n">영향 범위 확인</text>
  <path d="M315 245H345" class="e"/><path d="M600 245H630" class="e"/><path d="M885 245H915" class="e"/>
  <rect x="190" y="440" width="820" height="90" rx="12" class="box"/><text x="220" y="478" class="h">운영 기록</text><text x="380" y="478" class="t">노드명·시간·조건·조치·복구 결과를 기록해 재발 분석에 사용</text><text x="380" y="505" class="n">노드 운영은 애플리케이션 Pod의 가용성과 직접 연결된다.</text>
</svg>
