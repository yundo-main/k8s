<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',Arial,sans-serif">
  <title>스토리지 운영 점검 흐름</title><desc>StorageClass, PVC, PV와 실제 Pod 마운트를 확인한다.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker><style>.title{font-size:28px;font-weight:700;fill:#0f172a}.sub{font-size:15px;fill:#475569}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.6}.h{font-size:19px;font-weight:700;fill:#1d4ed8}.t{font-size:14px;fill:#1e293b}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{font-size:13px;fill:#64748b}</style></defs>
  <rect width="1200" height="650" fill="#fff"/><text x="50" y="55" class="title">스토리지 운영 점검</text><text x="50" y="84" class="sub">PVC 요청이 StorageClass·CSI를 거쳐 PV와 Pod 마운트로 연결되는지 확인한다.</text>
  <rect x="60" y="155" width="245" height="185" rx="12" class="box"/><text x="85" y="195" class="h">1. StorageClass</text><text x="85" y="235" class="t">provisioner 확인</text><text x="85" y="261" class="t">기본 클래스·파라미터</text><text x="85" y="311" class="n">CSI Driver 연결 확인</text>
  <rect x="345" y="155" width="245" height="185" rx="12" class="box"/><text x="370" y="195" class="h">2. PVC</text><text x="370" y="235" class="t">Pending / Bound</text><text x="370" y="261" class="t">요청 용량·AccessMode</text><text x="370" y="311" class="n">kubectl describe pvc</text>
  <rect x="630" y="155" width="245" height="185" rx="12" class="box"/><text x="655" y="195" class="h">3. PV / CSI</text><text x="655" y="235" class="t">PV 상태·ReclaimPolicy</text><text x="655" y="261" class="t">Controller·Node Plugin</text><text x="655" y="311" class="n">Mount 오류·이벤트</text>
  <rect x="915" y="155" width="225" height="185" rx="12" class="box"/><text x="940" y="195" class="h">4. Pod</text><text x="940" y="235" class="t">volumeMount</text><text x="940" y="261" class="t">파일 쓰기·재시작</text><text x="940" y="311" class="n">데이터 보존 확인</text>
  <path d="M305 247H340" class="e"/><path d="M590 247H625" class="e"/><path d="M875 247H910" class="e"/>
  <rect x="190" y="440" width="820" height="90" rx="12" class="box"/><text x="220" y="478" class="h">운영 주의</text><text x="380" y="478" class="t">PVC를 삭제하기 전에 데이터 백업·ReclaimPolicy·복구 절차를 확인한다.</text><text x="380" y="505" class="n">테스트용 emptyDir와 운영용 영속 스토리지를 구분한다.</text>
</svg>
