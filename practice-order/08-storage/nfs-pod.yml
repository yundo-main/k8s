apiVersion: v1
kind: Pod
metadata:
  name: nfs-server
  labels:
    app: nfs-server
spec:
  nodeSelector:
    kubernetes.io/os: linux
  containers:
    - name: nfs-server
      image: itsthenetwork/nfs-server-alpine:latest
      env:
        - name: SHARED_DIRECTORY
          value: /exports
      securityContext:
        privileged: true
      ports:
        - name: nfs
          containerPort: 2049
          protocol: TCP
        - name: rpcbind
          containerPort: 111
          protocol: UDP
      volumeMounts:
        - name: nfs-data
          mountPath: /exports
  volumes:
    - name: nfs-data
      hostPath:
        path: /nfs-vol
        type: DirectoryOrCreate
