<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">초기 이미지 기반 3-Tier 실습 구조</title>
  <desc id="desc">3-Tier 실습의 Frontend, Backend, 테스트용 MariaDB Deployment와 ClusterIP Service 연결을 보여준다. 영속 저장소는 09단계 StatefulSet을 선택할 때 추가한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .body { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .tier { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .frontend { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .backend { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .database { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .support { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .storage { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="920" fill="#ffffff"/>
  <text x="60" y="55" class="title">초기 이미지 기반 3-Tier 실습 구조</text>
  <text x="60" y="84" class="body">기준 manifest: k8s/practice-order/10-3tier/</text>
  <text x="920" y="84" class="body">외부: 10.10.10.150~152:30198 → ingress-nginx</text>

  <rect x="50" y="120" width="1400" height="330" rx="20" class="tier"/>
  <text x="80" y="160" class="heading">Ingress 라우팅과 애플리케이션 계층</text>
  <text x="80" y="184" class="small">/api/ → fastcgi-backend:8000 · / → frontend:80</text>

  <rect x="90" y="195" width="330" height="200" rx="16" class="frontend"/>
  <text x="120" y="238" class="heading">Frontend</text>
  <text x="120" y="276" class="body">frontend.yml</text>
  <text x="120" y="310" class="small">Deployment · ConfigMap · Service</text>
  <text x="120" y="340" class="small">nginx:stable · frontend:80</text>
  <text x="120" y="370" class="small">ConfigMap: frontend-html</text>

  <rect x="585" y="195" width="330" height="200" rx="16" class="backend"/>
  <text x="615" y="238" class="heading">Backend</text>
  <text x="615" y="276" class="body">backend.yml</text>
  <text x="615" y="310" class="small">Deployment · ConfigMap · Service</text>
  <text x="615" y="340" class="small">python:3.12-slim · fastcgi-backend:8000</text>
  <text x="615" y="370" class="small">ConfigMap: backend-app</text>

  <rect x="1080" y="195" width="330" height="200" rx="16" class="database"/>
  <text x="1110" y="238" class="heading">Database</text>
  <text x="1110" y="276" class="body">Deployment: mariadb</text>
  <text x="1110" y="310" class="small">image: mariadb:11</text>
  <text x="1110" y="340" class="small">Storage: emptyDir (test)</text>
  <text x="1110" y="370" class="small">Service: mariadb:3306</text>

  <path d="M420 295 H585" class="flow"/>
  <text x="456" y="278" class="small">ClusterIP DNS</text>
  <path d="M915 295 H1080" class="flow"/>
  <text x="951" y="278" class="small">mariadb:3306</text>

  <rect x="50" y="500" width="660" height="300" rx="20" class="support"/>
  <text x="80" y="540" class="heading">공통 연결 정보와 저장소</text>

  <rect x="90" y="575" width="260" height="155" rx="14" class="support"/>
  <text x="118" y="615" class="heading">ConfigMap</text>
  <text x="118" y="652" class="small">각 tier manifest에 포함</text>
  <text x="118" y="682" class="small">HTML · main.py 제공</text>
  <text x="118" y="712" class="small">Pod 파일로 마운트</text>

  <rect x="410" y="575" width="260" height="155" rx="14" class="support"/>
  <text x="438" y="615" class="heading">Secret</text>
  <text x="438" y="652" class="small">mariadb-secret</text>
  <text x="438" y="682" class="small">DB 사용자·비밀번호</text>
  <text x="438" y="712" class="small">Backend 환경 변수로 주입</text>

  <path d="M255 575 V450" class="dashed"/>
  <path d="M540 575 V450" class="dashed"/>

  <rect x="790" y="500" width="660" height="300" rx="20" class="storage"/>
  <text x="820" y="540" class="heading">저장소 선택</text>

  <rect x="830" y="575" width="260" height="155" rx="14" class="storage"/>
  <text x="858" y="615" class="heading">기본 테스트</text>
  <text x="858" y="652" class="small">emptyDir</text>
  <text x="858" y="682" class="small">Pod 재생성 시 초기화</text>
  <text x="858" y="712" class="small">database.yml에서 사용</text>

  <rect x="1150" y="575" width="260" height="155" rx="14" class="storage"/>
  <text x="1178" y="615" class="heading">영속 저장소 선택</text>
  <text x="1178" y="652" class="small">09 StatefulSet</text>
  <text x="1178" y="682" class="small">PVC · StorageClass</text>
  <text x="1178" y="712" class="small">NFS CSI 연결</text>

  <path d="M1110 652 H1090" class="flow"/>
  <text x="1085" y="632" text-anchor="end" class="small">선택 구성</text>

  <text x="60" y="870" class="heading">실습 검증</text>
  <text x="60" y="900" class="body">kubectl get deployment,pod,service · 내부 DNS: frontend, fastcgi-backend, mariadb</text>
</svg>
