apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcgi-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastcgi-backend
  template:
    metadata:
      labels:
        app: fastcgi-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          workingDir: /app
          command:
            - /bin/sh
            - -c
          args:
            - >-
              pip install --no-cache-dir fastapi uvicorn pymysql python-multipart
              && uvicorn main:app --host 0.0.0.0 --port 8000
          env:
            - name: MODULE_NAME
              value: main
            - name: DB_HOST
              value: mariadb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: database
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: backend-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-app
data:
  main.py: |
    from fastapi import FastAPI, Form , HTTPException
    import pymysql

    app = FastAPI()

    @app.post("/api/register")
    async def register(username: str = Form(...), password: str = Form(...)):
        conn = pymysql.connect(
            host="mariadb",
            user="fcgiuser",
            password="fcgipass",
            database="fcgidb"
        )
        with conn.cursor() as cursor:
            cursor.execute("INSERT INTO users (username, password) VALUES (%s, %s)", (username, password))
        conn.commit()
        return {"message": "가입 완료!"}

    @app.post("/api/login")
    async def login(username: str = Form(...), password: str = Form(...)):
        conn = pymysql.connect(
            host="mariadb",
            user="fcgiuser",
            password="fcgipass",
            database="fcgidb"
        )
        with conn.cursor() as cursor:
            cursor.execute("SELECT * FROM users WHERE username=%s AND password=%s", (username, password))
            result = cursor.fetchone()
        if result:
            return {"message": "로그인 성공"}
        else:
            raise HTTPException(status_code=401, detail="로그인 실패")
---
apiVersion: v1
kind: Service
metadata:
  name: fastcgi-backend
spec:
  type: ClusterIP
  selector:
    app: fastcgi-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
